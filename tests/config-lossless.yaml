####
## Beets Configuration file.
## ~./config/beets/config-lossless.yaml
#####

### Global Options
library: ./musiclibrary-lossless.db
directory: ./music-files/
pluginpath: []
logging:
    format_str: false
clutter: ["Thumbs.DB", ".DS_Store", "#recycle", "@eaDir", "*.part", ".AppleDouble"]
ignore: [".*", "*~", "System Volume Information", "#recycle", "@eaDir", "@*", ".DS_Store*", "*.part", ".AppleDouble", ".TemporaryItems"]
threaded: no
per_disc_numbering: yes
## change characters for portability
replace:
    '[\\/]': _
    '^\.': _
    '[\x00-\x1f]': _
    '[<>:"\?\*\|]': _
    '\.$': _
    '\s+$': ''
    '^\s+': ''
    '^-': _
    "\u2018": "'"   #  left single quote
    "\u2019": "'"   #  right single quote
    "\u201C": '"'   #  left double quote
    "\u201D": '"'   #  right double quote
    "\u2033": '"'   #   double prime
    "\u2013": '-'   #   en dash
    "\u2026": '...'   #   HORIZONTAL ELLIPSIS
    "\u2400": '' # SYMBOL FOR NULL
    
path_sep_replace: _
asciify_paths: true
art_filename: cover
timeout: 5.0
verbose: 0
terminal_encoding:
original_date: no # on passe par le hook maintenant afin de garder release year pour le path
id3v23: no
va_name: "Various Artists"
duplicate_verbose_prompt: yes

plugins: [
  ## metadata plugins
  musicbrainz,
  #discogs,
  fromfilename,
  #artistcountry,  
  oldestdate, 
  types,
  albumtypes, 
  zero,
  originquery,  # Use gazelle origin export to help search match the downloaded version
  importsource, #add original media files paths in  source_path field. Good to identify converted items!!
  edit,  # pour modifier les metadata a la main depuis vi
  
  ## path format plugins
  inline,
  ftintitle,
  advancedrewrite,
  substitute,
  #bucket,
  
  ## interoperability plugins
  convert,

  # DB quality plugins
  replace,
  
  ## Beets command enhancement plugins
  bareasc, #searches your library using simple ASCII character matching
  fuzzy, #use fuzzy pattern matching. This can be useful if you want to find a track with complicated characters in the title.
  #fish #autocompletion
  info,  #dumps the current tag values for any file format supported by beets
  
  ## misc plugins
  filetote, # #copy non music files also. nice mix of copyartifacts and extrafiles 
  importfeeds,
  
]

import:
    write: yes #yes
    copy: yes
    move: no #yes
    link: no
    delete: no
    resume: ask
    incremental: no
    quiet_fallback: asis
    none_rec_action: ask
    timid: yes #yes
    log: ./untaggableFiles-lossless.log
    autotag: yes #yes except for generique import
    quiet: no #no
    singletons: no
    default_action: apply
    languages: [fr, en]
    detail: no
    flat: no
    group_albums: no
    pretend: false
    searchlimit: 5
    search_ids: []
    bell: yes


ui:
    terminal_width: 80
    length_diff_thresh: 10.0
    color: yes

format_item: $artist - $albumartist - $album - $title - $path
format_album: $albumartist - $album - $path
time_format: '%Y-%m-%d'
#time_format: '%Y-%m-%d %H:%M:%S'
format_raw_length: no

sort_album: albumartist+ album+
sort_item: artist+ album+ disc+ track+
sort_case_insensitive: yes

