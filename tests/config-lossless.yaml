convert:
    dest: ./convertedByBeets
    copy_album_art: yes
    album_art_maxwidth: 800
    never_convert_lossy_files: yes
    #pretend: no
    #threads: 1
    format: mp3
    formats:
        aac:
            command: ffmpeg -i $source -y -vn -acodec aac -aq 1 $dest
            extension: m4a
        alac:
            command: ffmpeg -i $source -y -vn -acodec alac $dest
            extension: m4a
        flac: ffmpeg -i $source -y -vn -acodec flac $dest
        #mp3: ffmpeg -i $source -y -vn -aq 0 $dest
        mp3: /var/services/homes/djhibee/NAS-Synology/scripts/encodeToGapLessMp3.sh $source $dest
        opus: ffmpeg -i $source -y -vn -acodec libopus -ab 96k $dest
        ogg: ffmpeg -i $source -y -vn -acodec libvorbis -aq 3 $dest
        wma: ffmpeg -i $source -y -vn -acodec wmav2 -vn $dest
    max_bitrate: 500
    auto: no #no
    #tmpdir:
    quiet: false # false
    embed: yes
    #paths: {}

types:
  rating: int
  live: bool
  vrac: bool
  compilSamba: bool
  release_date_backup: date

album_fields:
    the_path_year: |
        if original_year:
          return original_year
        elif year:
          return year
        else:
          return "xxxx"
    is_not_various_artists: |
        if albumartist == "Various Artists":
          return 0
        else:
          return 1 
    is_single_composer: |
        initial_composer = ""
        if items and items[0].composers:
           initial_composer = items[0].composers[0]
        if ( initial_composer == "" )  or (initial_composer == "Various Artists"):
          return 0
        for item in items:
            if item.composers and item.composers[0] != initial_composer:
              return 0;
        return 1       
    bitrate: |
        total = 0
        for item in items:
            total += item.bitrate
        return round(total / len(items))
      
    # Produces the "[16-44 FLAC]" string.
    album_quality: |
        qual = ""
        if len(set([item.format for item in items])) != 1 or len(set([item.bitdepth for item in items])) != 1 or len(set([item.samplerate for item in items])) != 1:
            qual += "[MUTT]"
        i = items[0]
        if i.format == "MP3":
            if i.bitrate_mode:
                qual += f"MP3 {i.bitrate_mode}"
            qual += f"MP3"
        else:
            qual += f"{i.format} {i.bitdepth}-{i.samplerate // 1000}"
        return qual
        
    release_version_year: |
       from datetime import datetime
       backup_timestamp = db_obj._values_flex.get('release_date_backup')
       if backup_timestamp:
         return datetime.fromtimestamp(backup_timestamp).year 
       return year
        

item_fields:
    the_composer: |
      if composers:
        return "- " + composers[0] + " -"
      elif artist:
        return "- " + artist + " -"
      else:
        return ""

    the_disk_track: f"{disc}-{track:02d}" if disctotal > 1 else f"{track:02d}"

    the_classical_artist: |
      if comp:
        return albumartist
      else:
        if composers:
          return composers[0]
        elif albumartist:
            return albumartist
        else:
          return ""

    the_path_year: |
        if original_year:
          return original_year
        elif year:
          return year
        else:
          return "xxxx"
          
    the_generique_artist: |
        if artist:
          return " (" + artist + ")" 
        else:
          return ""
    
    release_version_year: |
      from datetime import datetime
      # On va lire directement dans le dictionnaire des champs flexibles stockes en BDD
      backup_timestamp = db_obj._values_flex.get('release_date_backup')
      if backup_timestamp:
        return datetime.fromtimestamp(backup_timestamp).year
      return year
        
    

          
