[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beets-oldestdate"
version = "0.10.0" # Also change in beetsplug/mb_api.py
authors = [
    { name="djhibee" },
]
description = "Beets plugin that finds oldest possible track recording or release date"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mediafile>=0.9",
    "requests>=2.20",
    "python-dateutil>=2.8",
    "beets>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]

[project.entry-points.beetsplug]
beets-oldestdate = "beets.oldestdate"

[project.urls]
"Homepage" = "https://github.com/djhibee/beets-oldestdate"
"Bug Tracker" = "https://github.com/djhibee/beets-oldestdate/issues"
